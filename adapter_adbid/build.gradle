apply plugin: 'com.android.library'

// AAR 版本号，产物命名：UBidding_adapter_limo_${adapterVersion}.aar
def adapterVersion = "4.0.1"

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 30
        versionName adapterVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "UBidding_adapter_limo_${adapterVersion}.aar"
        }
    }
}

repositories {
    flatDir {
        // SDK aar 统一放在 app/libs 下，此处直接引用，保持一套共用
        dirs '../app/libs'
    }
}

dependencies {
    // UBidding 主 SDK 由宿主提供
    // 领摩 Adbid 聚合 SDK（经独立 module 包装，避免 AGP 禁止 library 直接依赖本地 .aar）
    compileOnly(files("../app/libs/adbid_sdk_2.1.0.25_1015_1539.aar"))
    compileOnly(files("../app/libs/UBidding.SDK_4.1.2.11.aar"))

    compileOnly 'androidx.annotation:annotation:1.2.0'
}

// 避免 lint 注解抽取任务在无外网/403 环境下阻断 AAR 打包
tasks.configureEach { task ->
    if (task.name.startsWith("extract") && task.name.endsWith("Annotations")) {
        task.enabled = false
    }
}

// extract*Annotations 被禁用后不会生成 typedefs.txt，但 sync*LibJars 仍把它当作必选输入。
// 用独立任务在 sync 之前写出空文件（兼容 clean，且早于 @InputFile 校验）。
afterEvaluate {
    android.libraryVariants.all { variant ->
        def capName = variant.name.capitalize()
        def typedefFile = file("$buildDir/intermediates/annotations_typedef_file/${variant.name}/typedefs.txt")
        def stubTask = tasks.register("create${capName}TypedefStub") {
            outputs.file(typedefFile)
            doLast {
                typedefFile.parentFile.mkdirs()
                if (!typedefFile.exists()) {
                    typedefFile.createNewFile()
                }
            }
        }
        tasks.named("sync${capName}LibJars").configure {
            dependsOn(stubTask)
        }
    }
}
